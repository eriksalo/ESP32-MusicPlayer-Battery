; PlatformIO project for ESP32-MusicPlayer-Battery
; Target: Seeed Studio XIAO ESP32-S3
;
; Build:    pio run
; Flash:    pio run -t upload
; Upload web UI to LittleFS:  pio run -t uploadfs
; Monitor:  pio device monitor

[env:seeed_xiao_esp32s3]
platform = espressif32@^6.7.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Use a partition table with room for OTA + LittleFS for the web UI.
; "default_8MB.csv" gives two app partitions (~3.3MB each) + ~1.5MB SPIFFS/LittleFS.
board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs
board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_opi  ; enable PSRAM (8MB on XIAO ESP32-S3)

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=2

lib_deps =
    https://github.com/schreibfaul1/ESP32-audioI2S.git#3.0.13
    https://github.com/ESP32Async/ESPAsyncWebServer.git#v3.6.0
    https://github.com/ESP32Async/AsyncTCP.git#v3.3.2
    https://github.com/tzapu/WiFiManager.git#v2.0.17
    ayushsharma82/ElegantOTA@^3.1.5
    bblanchon/ArduinoJson@^7.1.0
